<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SISTEMA POSTAL PANAMÁ </title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --panel-bg: #ffffff;
            --text-main: #334155;
            --text-light: #94a3b8;
            --accent-soft: #0ea5e9;
            --warning: #f59e0b;
            --danger: #e11d48;
            --bg-body: #f1f5f9;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-body); overflow: hidden; }
        .main-layout { display: flex; height: 100vh; width: 100vw; flex-direction: row; }

        .info-panel {
            width: 360px;
            background: var(--panel-bg);
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
        }

        #map { flex-grow: 1; height: 100%; background: #e5e7eb; }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column-reverse; }
            .info-panel { width: 100%; height: auto; max-height: 50vh; padding: 12px; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); overflow-y: auto; }
            .instruction-box { display: none; }
            h2 { font-size: 0.8rem; margin: 0 0 8px 0; margin-bottom: 8px; }
            .input-group { margin-bottom: 8px; }
            label { font-size: 0.65rem; margin-bottom: 4px; }
            input { padding: 8px; font-size: 0.85rem; }
            .result-box { margin-top: 8px; margin-bottom: 8px; padding: 12px; }
            #postal-code-panel { font-size: 1.3rem; margin-top: 3px; }
            .footer { font-size: 0.65rem; padding-top: 4px; margin-top: 4px; }
        }

        .instruction-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: var(--text-main);
            line-height: 1.5;
        }
        .instruction-box b { color: var(--accent-soft); }

        h2 { color: var(--text-main); font-size: 1rem; margin: 0 0 20px 0; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; border-left: 4px solid var(--accent-soft); padding-left: 12px; }

        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.7rem; font-weight: 700; color: var(--text-light); margin-bottom: 8px; text-transform: uppercase; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'JetBrains Mono', monospace;
            background: #fcfcfc;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .result-box {
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 20px;
            background: #f8fafc;
            border: 1px dashed var(--accent-soft);
            border-radius: 12px;
            text-align: center;
        }

        #postal-code-panel {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 5px;
            color: var(--text-main);
        }

        .leaflet-popup-content-wrapper { border-radius: 8px; }
        .popup-container { text-align: center; padding: 5px; }
        .popup-tag { font-size: 10px; color: var(--text-light); text-transform: uppercase; font-weight: 700; }
        .popup-code { font-size: 18px; font-weight: 700; color: var(--accent-soft); font-family: 'JetBrains Mono'; margin: 5px 0; }
        .popup-zona { font-size: 14px; font-weight: 600; color: var(--warning); }
        
        .popup-externo { color: var(--danger); padding: 10px; text-align: center; }
        .popup-externo b { display: block; font-size: 13px; margin-bottom: 4px; }

        /* Estilo para el botón de estafeta cercana en el popup */
        .btn-near {
            background: var(--accent-soft);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            text-transform: uppercase;
        }

        .footer { text-align: center; font-size: 0.7rem; color: var(--text-light); padding-top: 0; margin: 0; }
        .zoom-warning { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; background: rgba(245, 158, 11, 0.9); color: white; padding: 10px 20px; border-radius: 6px; display: none; }
        .gps-btn { background: white; width: 34px; height: 34px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    </style>
</head>
<body>

<div id="zoom-alert" class="zoom-warning">⚠️ Acerque más el mapa para ver las viviendas</div>

<div class="main-layout">
    <div class="info-panel">
        <h2>Generador de Códigos postales</h2>
        <div class="instruction-box">
            <b>Instrucciones:</b><br>
            1. Haga clic en un punto conocido.<br>
            2. El área en <span style="color:var(--warning); font-weight:700">amarillo</span> es la zona postal.<br>
            3. El código obtenido es el <b>Código Postal</b>.
        </div>
        <div class="input-group">
            <label>Zona Postal (COTEL)</label>
            <input type="text" id="vmLevel" placeholder="Esperando selección..." readonly>
        </div>
        <div class="input-group">
            <label>Coordenadas (Lat, Lng)</label>
            <input type="text" id="coordsInput" placeholder="---, ---" readonly>
        </div>
        <div class="result-box">
            <label>CÓDIGO POSTAL</label>
            <span id="postal-code-panel">---</span>
        </div>
        <div class="footer">
            Diseñado por Raúl Víquez<br>
            © Para COTEL Panamá
        </div>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TABLA_BUSQUEDA = { "A5899":"A2","A6000":"A3","A6099":"A4","A6123":"A5","A6130":"A6","A6132":"A7","A6133":"A8","A6134":"A9","A6135":"AA","A6143":"AB","A6199":"AC","A6215":"AD","A6216":"AE","A6217":"AF","A6219":"AG","A6220":"AH","A6222":"AI","A6223":"AJ","A6232":"AK","A6250":"AL","A6301":"AM","A6302":"AN","A6303":"AO","A6304":"AP","A6305":"AQ","A6306":"AR","A6307":"AS","A6308":"AT","A6309":"AU","A6320":"AV","A6400":"AW","A6499":"AX","A6500":"AY","A6599":"AZ","A6700":"B0","A6799":"B1","A6800":"B2","A6899":"B3","A7000":"B4","A7099":"B5","A7200":"B6","A7299":"B7","A7300":"B8","A7324":"B9","A7399":"BA","A7400":"BB","A7499":"BC","A7500":"BD","A7599":"BE","A7700":"BF","A7799":"BG","A7800":"BH","A7899":"BI","A7900":"BJ","A7999":"BK","A8000":"BL","A8099":"BM","A8200":"BN","A8299":"BO","A8300":"BP","A8399":"BQ","A8400":"BR","A8499":"BS","A8500":"BT","A8599":"BU","A8600":"BV","A8699":"BW","A8700":"BX","A8799":"BY","A8800":"BZ","A8899":"C0","A9000":"C1","A9099":"C2","A9100":"C3","A9199":"C4","A9200":"C5","A9299":"C6","A9300":"C7","A9399":"C8","A9400":"C9","A9499":"CA","A9500":"CB","A9599":"CC","A9600":"CD","A9699":"CE","A9700":"CF","A9799":"CG","A9800":"CH","A9899":"CI","A9900":"CJ","A9999":"CK","B0000":"CL","B0099":"CM","B0100":"CN","B0199":"CO","B0200":"CP","B0299":"CQ","B0300":"CR","B0399":"CS","B0400":"CT","B0499":"CU","B0500":"CV","B0599":"CW","B0600":"CX","B0699":"CY","B0700":"CZ","B0799":"D0","B0800":"D1","B0899":"D2","B0900":"D3","B0999":"D4","B1000":"D5","B1099":"D6","B1100":"D7","B1199":"D8","B1200":"D9","B1299":"DA","B1300":"DB","B1399":"DC","B1400":"DD","B1499":"DE","B1500":"DF","B1599":"DG","B1600":"DH","B1699":"DI","B1700":"DJ","B1799":"DK","B1800":"DL","B1899":"DM","B1900":"DN","B1999":"DO","B2000":"DP","B2099":"DQ","B2100":"DR","B2199":"DS","B2200":"DT","B2299":"DU","B2300":"DV","B2399":"DW","B2400":"DX","B2499":"DY","B2500":"DZ","B2599":"E0","B2600":"E1","B2699":"E2","B2700":"E3","B2799":"E4","B2800":"E5","B2899":"E6","B2900":"E7","B2999":"E8","B3000":"E9","B3099":"EA","B3100":"EB","B3199":"EC","B3200":"ED","B3299":"EE","B3300":"EF","B3399":"EG","B3400":"EH","B3499":"EI","B3500":"EJ","B3599":"EK","B3600":"EL","B3699":"EM","B3700":"EN","B3799":"EO","B3800":"EP","B3899":"EQ","B3900":"ER","B3999":"ES","B4000":"ET","B4099":"EU","B4100":"EV","B4199":"EW","B4200":"EX","B4299":"EY","B4300":"EZ","B4399":"F0","B4400":"F1","B4499":"F2","B4500":"F3","B4599":"F4","B4600":"F5","B4699":"F6","B4700":"F7","B4799":"F8","B4800":"F9","B4899":"FA","B4900":"FB","B4999":"FC","B5000":"FD","B5099":"FE","B5100":"FF","B5199":"FG","B5200":"FH","B5299":"FI","B5300":"FJ","B5399":"FK","B5400":"FL","B5499":"FM","B5500":"FN","B5599":"FO","B5600":"FP","B5699":"FQ","B5700":"FR","B5799":"FS","B5800":"FT","B5899":"FU","B5900":"FV","B5999":"FW","B6000":"FX","B6099":"FY","B6100":"FZ","B6199":"G0","B6200":"G1","B6299":"G2","B6300":"G3","B6399":"G4","B6400":"G5","B6499":"G6","B6500":"G7","B6599":"G8","B6600":"G9","B6699":"GA","B6700":"GB","B6799":"GC","B6800":"GD","B6899":"GE","B6900":"GF","B6999":"GG","B7000":"GH","B7099":"GI","B7100":"GJ","B7199":"GK","B7200":"GL","B7299":"GM","B7300":"GN","B7399":"GO","B7400":"GP","B7499":"GQ","B7500":"GR","B7599":"GS","B7600":"GT","B7699":"GU","B7700":"GV","B7799":"GW","B7800":"GX","B7899":"GY","B7900":"GZ","B7999":"H0"};
const ORIGIN = { lat: 10.0, lng: -83.0 };
const PARAMS = { RES_PICO: ((0.143/24)/25)/8, ALFA: "23456789ABCDEFGHJKLMNPQRSTVWXYZ", MACRO_X_COUNT: 42 };

const mapaSatelite = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20 });
const map = L.map('map', { zoomControl: false, layers: [mapaSatelite] }).setView([8.98, -79.52], 12);
L.control.zoom({ position: 'bottomright' }).addTo(map);

// Capas de datos
let layerZonas = L.geoJSON(null, { style: { color: "#f59e0b", weight: 2, fillOpacity: 0.05 } }).addTo(map);
let markerLayer = L.layerGroup().addTo(map);
let estafetasPoints = L.layerGroup().addTo(map);
let lineasCercanas = L.layerGroup().addTo(map); // Para la línea punteada

// Cargar Estafetas Polígonos
fetch('estafetas.geojson').then(r => r.json()).then(data => layerZonas.addData(data));

// Cargar Estafetas Puntos (estafetasp.geojson)
let estafetasData = [];
fetch('estafetasp.geojson').then(r => r.json()).then(data => {
    estafetasData = data.features;
    
    // Crear la capa GeoJSON
    const geojsonLayer = L.geoJSON(data, {
        pointToLayer: (feature, latlng) => {
            // Usamos CircleMarker pero con un radio fijo
            return L.circleMarker(latlng, {
                radius: 8,
                fillColor: "#e11d48",
                color: "#ffffff",
                weight: 2,
                fillOpacity: 0.9,
                pane: 'markerPane' // Forzamos que esté en el panel de marcadores (siempre arriba)
            });
        },
        onEachFeature: (feature, layer) => {
            const props = feature.properties;
            const content = `
                <div style="text-align:center; padding:5px;">
                    <b style="color:#e11d48; font-size:13px;">${props.ESTAF_NAME}</b><br>
                    <span style="font-size:11px; color:#64748b;">Código: ${props.ESTAF_CODE}</span>
                </div>
            `;

            layer.bindTooltip(content, {
                direction: 'top',
                sticky: false,
                offset: [0, -10],
                className: 'estafeta-tooltip'
            });

            // Al pasar el mouse, resaltamos
            layer.on('mouseover', function (e) {
                this.setStyle({ fillColor: "#000", radius: 10 });
            });

            layer.on('mouseout', function (e) {
                this.setStyle({ fillColor: "#e11d48", radius: 8 });
            });

            // IMPORTANTE: Detener la propagación para que no dispare el clic del mapa
            layer.on('mousedown', function(e) {
                L.DomEvent.stopPropagation(e);
            });
        }
    }).addTo(estafetasPoints);

    // Forzar que la capa de puntos esté siempre al frente de los polígonos
    estafetasPoints.bringToFront();
});

// Función de distancia (Haversine)
function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; // Radio Tierra km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Botón GPS
const GpsControl = L.Control.extend({
    onAdd: function(map) {
        let btn = L.DomUtil.create('button', 'gps-btn');
        btn.innerHTML = '📍';
        btn.onclick = () => map.locate({setView: true, maxZoom: 17, watch: true});
        return btn;
    }
});
new GpsControl({position: 'bottomright'}).addTo(map);

map.on('zoomend', function() {
    document.getElementById('zoom-alert').style.display = (map.getZoom() < 17) ? 'block' : 'none';
});

function encodeJS(num, len) {
    let s = ""; let n = Math.abs(Math.floor(num));
    for (let i = 0; i < len; i++) { s = PARAMS.ALFA[n % 30] + s; n = Math.floor(n / 30); }
    return s;
}

function getGridInfo(lat, lng) {
    const tpX = Math.floor(((lng - ORIGIN.lng) / PARAMS.RES_PICO) + 0.00001);
    const tpY = Math.floor(((ORIGIN.lat - lat) / PARAMS.RES_PICO) + 0.00001);
    const tnX = Math.floor(tpX / 8), tnY = Math.floor(tpY / 8);
    return { 
        macro: encodeJS((Math.floor(tnY / 600) * 42) + Math.floor(tnX / 600), 2), 
        micro: encodeJS((Math.floor((tnY % 600) / 25) * 24) + Math.floor((tnX % 600) / 25), 2), 
        nano: encodeJS(((tnY % 25) * 25) + (tnX % 25), 2), 
        pico: encodeJS(((tpY % 8) * 8) + (tpX % 8), 2) 
    };
}

function pointInPolygon(point, vs) {
    let x = point[0], y = point[1], inside = false;
    for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
        let xi = vs[i][0], yi = vs[i][1], xj = vs[j][0], yj = vs[j][1];
        if (((yi > y) != (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
}

let userMarker = null;

map.on('locationfound', function(e) {
    if (userMarker) map.removeLayer(userMarker);
    userMarker = L.circleMarker(e.latlng, { radius: 8, fillColor: "#0ea5e9", color: "#ffffff", weight: 3, opacity: 1, fillOpacity: 1 }).addTo(map);
});

function removerUbicacion() {
    if (userMarker) { map.removeLayer(userMarker); userMarker = null; }
    lineasCercanas.clearLayers();
}

// Función para encontrar estafeta más cercana
function buscarEstafetaCercana(lat, lng) {
    let minDest = Infinity;
    let estafetaCercana = null;

    estafetasData.forEach(f => {
        let d = getDistance(lat, lng, f.geometry.coordinates[1], f.geometry.coordinates[0]);
        if (d < minDest) {
            minDest = d;
            estafetaCercana = f;
        }
    });

    if (estafetaCercana) {
        lineasCercanas.clearLayers();
        let estCoord = [estafetaCercana.geometry.coordinates[1], estafetaCercana.geometry.coordinates[0]];
        
        // Dibujar línea punteada
        L.polyline([[lat, lng], estCoord], {
            color: '#e11d48',
            weight: 2,
            dashArray: '5, 10',
            opacity: 0.8
        }).addTo(lineasCercanas);

        L.popup()
            .setLatLng(estCoord)
            .setContent(`<b>${estafetaCercana.properties.ESTAF_NAME}</b><br>Distancia: ${minDest.toFixed(2)} km`)
            .openOn(map);
    }
}

map.on('click', function(e) {
    removerUbicacion();
    if (map.getZoom() < 17) return;

    let encontrada = null;
    layerZonas.eachLayer(layer => {
        const pt = [e.latlng.lng, e.latlng.lat];
        const geom = layer.feature.geometry;
        if (geom.type === "Polygon") {
            if (pointInPolygon(pt, geom.coordinates[0])) encontrada = layer.feature.properties;
        } else {
            geom.coordinates.forEach(poly => { if (pointInPolygon(pt, poly[0])) encontrada = layer.feature.properties; });
        }
    });

    markerLayer.clearLayers();

    if (!encontrada) {
        L.popup().setLatLng(e.latlng).setContent('<div class="popup-externo">⚠️ <b>ÁREA NO CONOCIDA</b><small>Fuera de zona postal</small></div>').openOn(map);
        document.getElementById('vmLevel').value = "DESCONOCIDO";
        document.getElementById('postal-code-panel').innerText = "---";
        return;
    }

    const res = getGridInfo(e.latlng.lat, e.latlng.lng);
    const zonaID = encontrada.VM_LEVEL2D || TABLA_BUSQUEDA[encontrada.VM_LEVEL] || "XX";
    const fullCode = zonaID + res.macro + res.micro + res.nano + res.pico;
    const formatted = fullCode.substring(0, 5) + "-" + fullCode.substring(5);

    document.getElementById('vmLevel').value = encontrada.VM_LEVEL;
    document.getElementById('coordsInput').value = `${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
    document.getElementById('postal-code-panel').innerText = formatted;

    L.circleMarker(e.latlng, { radius: 6, fillColor: "#0ea5e9", color: "#fff", weight: 2, fillOpacity: 1 }).addTo(markerLayer);
    
    // Popup con botón de estafeta cercana
    L.popup({ offset: [0, -5] }).setLatLng(e.latlng).setContent(`
        <div class="popup-container">
            <span class="popup-tag">Código Postal</span>
            <div class="popup-code">${formatted}</div>
            <span class="popup-tag">Zona</span>
            <div class="popup-zona">${encontrada.VM_LEVEL}</div>
            <button class="btn-near" onclick="buscarEstafetaCercana(${e.latlng.lat}, ${e.latlng.lng})">Estafeta más cercana</button>
        </div>
    `).openOn(map);
});
</script>
</body>
</html>
